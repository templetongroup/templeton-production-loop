[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "templeton-coding-loop"
version = "1.0.0"
description = "Human-gated GitHub coding loop and runtime-neutral artifact proof runner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "The Templeton Group" }]

[project.scripts]
templeton-loop = "templeton_loop.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["templeton_loop*"]

[tool.setuptools.package-data]
templeton_loop = [
  "resources/skills/*/SKILL.md",
  "resources/skills/*/references/*",
  "resources/skills/*/templates/*",
  "resources/skills/*/scripts/*",
  "resources/skills/*/assets/*",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
