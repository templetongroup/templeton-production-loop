name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Install source package
        run: python -m pip install --no-build-isolation --no-deps .
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
      - name: Compile
        run: python -m compileall -q templeton_loop tests scripts exports
      - name: Build both deterministic editions
        run: python scripts/build_exports.py
      - name: Validate Hermes bundle
        run: python dist/stage/templeton-coding-loop-hermes-v1.0.0/exports/validate_bundle.py
      - name: Validate OpenClaw bundle
        run: python dist/stage/templeton-coding-loop-openclaw-v1.0.0/exports/validate_bundle.py
